name: Deploy static site to GitHub Pages

# Publishes the standalone prototype (index.html, styles.css, app.js)
# to GitHub Pages so it can be viewed at a public URL.

on:
  push:
    branches: [claude/tender-hawking-Zl8u0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (only the static files — no .git)
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/

      - name: Setup Pages (enables Pages on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
